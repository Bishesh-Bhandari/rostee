<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rostee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="chat-page">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">R</span>
      <div>
        <h1>rostee</h1>
        <span id="status" class="status">Checking server…</span>
      </div>
    </div>
    <!-- POST, not a link: a GET logout could be triggered by any <img> tag. -->
    <form method="post" action="/logout">
      <button type="submit" class="link">Log out</button>
    </form>
  </header>

  <!-- aria-live: screen readers announce new messages as they arrive. -->
  <main id="messages" class="messages" aria-live="polite"></main>

  <form id="composer" class="composer">
    <!-- Clicking a <label> opens its hidden file input: a styled upload button
         with no JavaScript needed to trigger the file picker. -->
    <label class="attach" title="Upload a PDF" aria-label="Upload a PDF">
      <input type="file" id="file" accept=".pdf,application/pdf" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
    </label>
    <textarea id="question" rows="1" placeholder="Ask about your documents…" aria-label="Your question"></textarea>
    <button type="submit" class="send" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <p class="hint">rostee answers only from your documents, and cites the page.</p>

  <script src="app.js"></script>
</body>
</html>
